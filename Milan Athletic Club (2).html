 for(let i=8;i<=10;i++)S.p.push({id:i,name:'Suplente '+(i-7),pos:'MED',num:i,ovr:65,grl:65,g:0,a:0,s:0,st:0});
 layout(S.f);
}
if(S.p.some(p=>p.st&&p.x==null))layout(S.f);
function updSave(){$('#sv').classList.toggle('show',can&&dirty)}
function setDirty(){dirty=true;updSave()}
const place=(d,p)=>{d.style.left=PX(p.x,p.y)+'%';d.style.top=p.y+'%'};
const teamOvr=()=>{const s=S.p.filter(p=>p.st);return s.length?Math.round(s.reduce((a,p)=>a+p.ovr,0)/s.length):0};
function card(p){
 const c=E('div','cr'),o=E('div','co'),ph=E('div','ph'),s=E('div','cs');
 o.append(E('b',0,p.ovr),E('i',0,p.pos));
 if(img(p)){const i=E('img');i.src=img(p);ph.append(i)}else ph.innerHTML=shirt(p,100);
 [['GOL',p.g],['AST',p.a],['SAL',p.s]].forEach(([l,v])=>{const d=E('span');d.append(E('b',0,v),document.createTextNode(l));s.append(d)});
 c.append(o,ph,E('div','cn',p.name||'—'),s);return c;
}
function av(p){const a=E('div','av');if(img(p)){const i=E('img');i.src=img(p);a.append(i)}else a.innerHTML=shirt(p,60);return a}
function mk(p,i){
 const d=E('div','pl');d.dataset.id=p.id;d.style.setProperty('--i',i);place(d,p);
 d.innerHTML=shirt(p,sz(p));d.append(E('span','nm',p.name));
 if(!edit){d.onclick=()=>{SN.tap();modal(p)};return d}
 d.onpointerdown=ev=>{
  const r=$('.fd').getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY;let mv=0;
  d.setPointerCapture(ev.pointerId);
  d.onpointermove=e=>{
   if(!mv&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>6){mv=1;d.classList.add('dg');SN.pick()}
   if(!mv)return;
   const y=Math.max(8,Math.min(92,(e.clientY-r.top)/r.height*100));
   p.y=y;p.x=Math.max(4,Math.min(96,50+((e.clientX-r.left)/r.width*100-50)/sc(y)));place(d,p);
  };
  d.onpointerup=()=>{d.onpointermove=d.onpointerup=null;d.classList.remove('dg');if(mv){SN.drop();setDirty();render()}else{SN.tap();modal(p)}};
 };
 return d;
}
function ctl(){
 const c=E('div','ctl');
 const s=E('button','pill');s.innerHTML=ic(mute?'mute':'snd',18);s.onclick=()=>{mute=!mute;s.innerHTML=ic(mute?'mute':'snd',18);SN.tap()};c.append(s);
 if(can){const e=E('button','pill'+(edit?' on':''),edit?'Listo':'Editar');e.onclick=()=>{edit=!edit;SN.open();render()};c.append(e)}
 return c;
}
function hdr(){
 const h=E('div','hd'),sd=E('div');sd.innerHTML=SH(44);h.append(sd);
 let t;
 if(edit){t=E('input','ti');t.type='text';t.value=S.team;t.oninput=()=>{S.team=t.value;setDirty()}}else t=E('div','ti',S.team);
 h.append(t,E('div'));return h;
}
function cnt(el,to){const t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
const go=v=>{view=v;SN.open();render(true)};
function vHome(){
 const w=E('div','vw'),h=E('div','hero');
 const sd=E('div','sd');sd.innerHTML=SH(96);
 const k=E('div','k','BIENVENIDO AL VESTUARIO');
 h.append(sd,k,E('h1',0,S.team),E('div','k','ATHLETIC CLUB · 2026'),E('p',0,'Tu plantel, tu alineación y tus cracks, todo en un solo lugar.'));
 w.append(h);
 const t=E('div','tiles');
 [['JUGADORES',S.p.length],['GOLES',S.p.reduce((a,p)=>a+p.g,0)],['ASISTENCIAS',S.p.reduce((a,p)=>a+p.a,0)],['GRL DEL EQUIPO',teamOvr()]].forEach(([l,v])=>{const d=E('div'),b=E('b',0,v);d.append(b,E('small',0,l));t.append(d)});
 w.append(t);
 const best=[...S.p].sort((a,b)=>b.ovr-a.ovr)[0];
 if(best){w.append(E('h2',0,'FIGURA DEL EQUIPO'));const f=E('div','fig'),c=card(best);c.onclick=()=>{SN.tap();modal(best)};f.append(c);w.append(f)}
 const c=E('div','cta');
 const b1=E('button','btn r','Ver alineación'),b2=E('button','btn w','Ver Top');b1.onclick=()=>go('line');b2.onclick=()=>go('top');c.append(b1,b2);w.append(c);
 return w;
}
function vLine(intro){
 const w=E('div','vw');w.append(hdr());
 const fd=E('div','fd'+(edit?' ed':'')+(intro?' in':''));
 fd.innerHTML=pitchSVG();
 const tm=E('div','tm');tm.innerHTML='GRL <b>'+teamOvr()+'</b>';fd.append(tm);
 S.p.filter(p=>p.st).forEach((p,i)=>fd.append(mk(p,i)));
 if(edit)fd.append(E('div','hint','Arrastrá las camisetas · tocá para abrir la carta'));
 w.append(fd);
 if(can&&edit){
  const tb=E('div','tb');
  const bt=(ico,lab,fn)=>{const b=E('button','i');b.innerHTML=ic(ico)+'<span>'+lab+'</span>';b.onclick=()=>{SN.open();fn()};return b};
  tb.append(bt('field','Formación',fmSheet),bt('shirt','Camiseta',kitSheet),bt('add','Jugador',addSheet));
  w.append(tb);
 }
 return w;
}
function vSquad(){
 const w=E('div','vw');w.append(hdr());
 const grp=(t,arr,add)=>{
  w.append(E('h2',0,t+' · '+arr.length));
  const g=E('div','grid');
  arr.forEach((p,i)=>{const c=card(p);c.style.setProperty('--i',i);c.onclick=()=>{SN.tap();modal(p)};g.append(c)});
  if(add){const b=E('button','addc');b.innerHTML=ic('add',34);b.onclick=()=>{SN.open();addSheet()};g.append(b)}
  w.append(g);
 };
 grp('TITULARES',S.p.filter(p=>p.st));grp('SUPLENTES',S.p.filter(p=>!p.st),edit&&can);
 return w;
}
function vTop(){
 const w=E('div','vw');w.append(hdr(),E('h2',0,'LOS MEJORES'));
 const sg=E('div','seg');sg.style.padding='0 16px';
 [['ovr','GRL'],['g','GOLES'],['a','ASIST.'],['s','SALV.']].forEach(([k,l])=>{const b=E('button',k===topK?'on':'',l);b.onclick=()=>{topK=k;SN.tap();render()};sg.append(b)});
 w.append(sg);
 const L=[...S.p].filter(p=>p[topK]>0).sort((a,b)=>b[topK]-a[topK]).slice(0,10);
 if(!L.length){w.append(E('p','s','Todavía no hay datos para este ranking.'));w.lastChild.style.padding='20px 16px';return w}
 const pod=E('div','pod'),cols=[[1,L[1],'#a8b0b8',84],[0,L[0],'#d4a73c',116],[2,L[2],'#b87333',64]];
 cols.forEach(([r,p,col,h])=>{
  if(!p){pod.append(E('div'));return}
  const d=E('div');d.append(av(p),E('div','pn',p.name),E('div','v',p[topK]));
  const b=E('div','bar',r+1);b.style.cssText='background:'+col+';height:'+h+'px;animation-delay:'+(r*.15)+'s';d.append(b);
  d.onclick=()=>{SN.tap();modal(p)};pod.append(d);
 });
 w.append(pod);
 L.slice(3).forEach((p,i)=>{
  const r=E('div','rw'),n=E('div'),nm=E('b',0,p.name);n.append(nm,E('small',0,p.pos));
  r.append(E('span','rk',i+4),av(p),n,E('span','vv',p[topK]));
  r.onclick=()=>{SN.tap();modal(p)};w.append(r);
 });
 return w;
}
function render(intro){
 const A=$('#app');A.textContent='';
 A.append({home:vHome,line:vLine,squad:vSquad,top:vTop}[view](intro));
 const tb=E('nav','tab');
 [['home','Inicio','home'],['line','Alineación','field'],['squad','Plantel','squad'],['top','Top','trophy']].forEach(([v,l,i])=>{
  const b=E('button',v===view?'on':'');b.innerHTML=ic(i,24)+'<span>'+l+'</span>';b.onclick=()=>{if(v!==view)go(v)};tb.append(b);
 });
 A.append(tb);
}
function sheet(title,fn,still){
 const M=$('#m');M.textContent='';
 const ov=E('div','ov'),sh=E('div','sh');
 if(still)ov.style.animation=sh.style.animation='none';
 ov.onclick=e=>{if(e.target===ov)closeS()};
 const x=E('button','x');x.innerHTML=ic('x');x.onclick=()=>{if(pend&&!confirm('¿Salir de la carta? Tus cambios se mantienen, pero acordate de tocar Guardar.'))return;closeS()};sh.append(x);
 if(title)sh.append(E('h3',0,title));
 fn(sh);ov.append(sh);M.append(ov);
}
let pend=false;const closeS=()=>{$('#m').textContent='';if(pend){pend=false;render()}};
function moveAll(){
 let miss=0;
 S.p.filter(p=>p.st).forEach(p=>{const d=$('.pl[data-id="'+p.id+'"]');if(!d){miss=1;return}place(d,p);d.querySelector('svg').outerHTML=shirt(p,sz(p))});
 if(miss)render();
}
function fmSheet(still){sheet('Formación',sh=>{
 sh.append(E('label',0,'Jugadores en cancha'));
 const a=E('div','seg');[5,7,9,11].forEach(n=>{const b=E('button',n===S.n?'on':'',n);b.onclick=()=>{SN.tap();setN(n);fmSheet(1)};a.append(b)});
 sh.append(a,E('label',0,'Esquema'));
 const f=E('div','seg');FM[S.n].forEach(x=>{const b=E('button',x===S.f?'on':'',x);b.onclick=()=>{layout(x);setDirty();moveAll();fmSheet(1)};f.append(b)});
 const xb=E('button','btn r');xb.innerHTML=ic('star',18)+' Armar XI ideal';xb.onclick=()=>{xi();closeS()};sh.append(f,E('label',0,'Después podés arrastrar cada camiseta.'),xb);
},still===1)}
function kitSheet(){sheet('Camiseta',sh=>{
 const pv=E('div');pv.style.cssText='text-align:center;margin:6px 0';
 const draw=()=>{pv.innerHTML=shirt({pos:'DEF',num:10},96)+shirt({pos:'POR',num:1},96)};draw();
 sh.append(pv,E('label',0,'Estilo'));
 const s=E('div','seg');[['r','Rayas'],['h','Mitades'],['l','Lisa']].forEach(([v,l])=>{const b=E('button',v===S.kit.s?'on':'',l);b.onclick=()=>{SN.tap();S.kit.s=v;[...s.children].forEach(c=>c.className=c===b?'on':'');draw();setDirty();render()};s.append(b)});
 sh.append(s);
 const r=E('div','f2');
 [['a','Principal'],['b','Detalle'],['g','Arquero']].forEach(([k,l])=>{
  const w=E('div');w.append(E('label',0,l));const i=E('input');i.type='color';i.value=ok(S.kit[k]);i.style.cssText='width:100%;height:44px;padding:2px;border:2px solid #cfc7b6;border-radius:10px;background:#fff';
  i.oninput=()=>{S.kit[k]=i.value;draw()};i.onchange=()=>{setDirty();render()};w.append(i);r.append(w)});
 const b=E('button','btn','Listo');b.onclick=closeS;sh.append(r,b);
})}
function form(p,cb){
 const f=E('div','f');
 const fld=(lab,k,type)=>{const w=E('div');w.append(E('label',0,lab));const i=E('input');i.type=type||'number';if(!type){i.inputMode='numeric';i.onfocus=()=>i.select()}else{i.autocomplete='off';i.autocapitalize='words';i.enterKeyHint='done';i.onkeydown=e=>{if(e.key==='Enter')i.blur()}}i.value=p[k]??'';i.oninput=()=>{p[k]=type?i.value:(+i.value||0);cb()};w.append(i);return w};
 f.append(fld('Nombre','name','text'));
 const w=E('div');w.append(E('label',0,'Posición'));
 const s=E('div','seg');POS.forEach(x=>{const b=E('button',x===p.pos?'on':'',x);b.onclick=()=>{SN.tap();p.pos=x;[...s.children].forEach(c=>c.className=c===b?'on':'');cb()};s.append(b)});
 w.append(s);f.append(w);
 const g=E('div','f2');[['Número','num'],['GRL','ovr'],['Goles','g'],['Asist.','a'],['Salvadas','s']].forEach(([l,k])=>g.append(fld(l,k)));
 f.append(g);return f;
}
function photo(p,done){
 const i=E('input');i.type='file';i.accept='image/*';i.style.display='none';document.body.append(i);
 i.onchange=()=>{const f=i.files[0];i.remove();if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=192;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,192,192);p.img=c.toDataURL('image/jpeg',.82);done()};im.src=r.result};
  r.readAsDataURL(f)};
 i.click();
}
function addSheet(){
 const p={id:Math.max(0,...S.p.map(x=>x.id))+1,name:'',pos:'MED',num:'',ovr:60,grl:60,g:0,a:0,s:0,st:0};
 sheet('Nuevo jugador',sh=>{
  const cw=E('div','mc');
  const fill=()=>{cw.textContent='';cw.append(card(p))};fill();
  const ph=E('button','btn w');ph.innerHTML=ic('cam',18)+' Foto';ph.onclick=()=>photo(p,fill);
  const fm=form(p,fill);fm.insertBefore(cw,fm.children[1]);sh.append(fm,ph);
  const b=E('button','btn r','Agregar al plantel');
  b.onclick=()=>{if(!p.name.trim())p.name='Jugador '+p.id;S.p.push(p);setDirty();closeS();render()};
  sh.append(b);
 });
}
function doSwap(out,inn){
 inn.x=out.x;inn.y=out.y;inn.pos=out.pos;out.st=0;inn.st=1;
 closeS();SN.whistle();setDirty();render();
 const d=$('.pl[data-id="'+inn.id+'"]');if(d)d.classList.add('pop');
}
function modal(p){sheet('',sh=>{
 const cw=E('div','mc fl'),st=E('div','s');st.style.cssText='text-align:center;margin-bottom:6px';
 const fill=()=>{cw.textContent='';cw.append(card(p));st.textContent=p.st?'Titular':'Suplente'};fill();
 sh.append(cw,st);
 if(edit){
  st.remove();const fm=form(p,()=>{fill();setDirty();pend=true});fm.insertBefore(cw,fm.children[1]);sh.append(fm);
  const ph=E('button','btn w');ph.innerHTML=ic('cam',18)+(img(p)?' Cambiar foto':' Foto');ph.onclick=()=>photo(p,()=>{fill();setDirty();pend=true});sh.append(ph);
  
  const bn=S.p.filter(q=>!q.st),stt=S.p.filter(q=>q.st);
  if(p.st&&bn.length){const b=E('button','btn r');b.innerHTML=ic('swap',18)+' Sustituir';b.onclick=()=>{SN.open();listSheet('Elegí quién entra por '+p.name,bn,q=>doSwap(p,q))};sh.append(b)}
  if(!p.st&&stt.length){const b=E('button','btn r');b.innerHTML=ic('swap',18)+' Poner en cancha';b.onclick=()=>{SN.open();listSheet('Elegí quién sale',stt,q=>doSwap(q,p))};sh.append(b)}
  const d=E('button','btn o');d.innerHTML=ic('del',18)+' Eliminar jugador';
  d.onclick=()=>{if(!confirm('¿Eliminar a '+(p.name||'este jugador')+'?'))return;
   const b0=S.p.find(q=>!q.st&&q!==p);
   if(p.st&&b0){b0.x=p.x;b0.y=p.y;b0.pos=p.pos;b0.st=1}
   S.p=S.p.filter(q=>q!==p);closeS();setDirty();render()};
  sh.append(d);const dn=E('button','btn r','Listo');dn.style.cssText='position:sticky;bottom:8px;width:100%;justify-content:center;margin:14px 0 0';dn.onclick=closeS;sh.append(dn);
 }
})}
function listSheet(title,arr,pick){sheet(title,sh=>{
 arr.forEach(p=>{
  const r=E('div','rw'),n=E('div');r.style.padding='6px 0';
  n.append(E('b',0,p.name),E('small',0,p.pos+' · GRL '+p.ovr));
  r.append(E('span','rk',p.num||''),av(p),n,E('span','vv',p.ovr));
  r.onclick=()=>{SN.tap();pick(p)};sh.append(r);
 });
})}
async function save(){
 if(!art)return;
 const j=JSON.stringify(S).replace(/</g,'\\u003c');
 const h=base.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j+b);
 SN.save();
 try{await art.publish(h)}catch(x){alert('No se pudo guardar: '+(x.code||x.message))}
}
$('#sv').onclick=save;
render(true);
(async()=>{try{
 const u=await claude.use('user');art=await claude.use('artifact');
 can=!!(u&&u.canEdit()&&art);edit=can;updSave();render();
}catch(x){}})();
</script></body></html>
